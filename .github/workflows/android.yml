name: Build NahidaGift APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Accept SDK Licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          ls -la app/build/outputs/apk/debug/ || echo "APK目录不存在，编译可能失败"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NahidaGift-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
